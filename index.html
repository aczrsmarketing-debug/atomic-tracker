<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>atomic-tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#FEF1D5;color:#03110D;font-family:'DM Sans',sans-serif;font-size:clamp(14px,2.2vw,16px);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
:root{--cr:#FEF1D5;--sl:#E0E0E0;--bl:#679CBC;--tn:#A38560;--rd:#C11720;--nv:#0C324A;--fo:#16302B;--bg:#390517;--bk:#03110D;--nh:62px}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:#FEF1D5}
::-webkit-scrollbar-thumb{background:#E0E0E0;border-radius:2px}
#app{width:100%;max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:var(--nh)}
#hud{background:#0C324A;padding:14px 18px 12px;position:sticky;top:0;z-index:100}
.ht{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.aw{position:relative;flex-shrink:0;cursor:pointer}
.awi{width:48px;height:48px;object-fit:cover;border-radius:50%;border:2px solid #679CBC;display:block}
.awo{position:absolute;inset:0;border-radius:50%;background:rgba(103,156,188,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.aw:active .awo{opacity:1}
.awl{position:absolute;bottom:-2px;right:-2px;background:#679CBC;color:#0C324A;font-size:10px;font-weight:800;padding:1px 5px;border-radius:10px;line-height:1.4}
#avf{display:none}
.hi{flex:1;min-width:0}
.hn{font-size:clamp(15px,3vw,19px);font-weight:800;color:#FEF1D5;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hk{font-size:clamp(10px,1.5vw,12px);color:#679CBC;font-weight:500;margin-top:1px}
.hr{display:flex;gap:16px;flex-shrink:0}
.hsi{text-align:right}
.hsl{font-size:clamp(9px,1.3vw,10px);color:rgba(254,241,213,.5);font-weight:600;display:block;text-transform:uppercase;letter-spacing:1px}
.hsv{font-size:clamp(14px,2.2vw,17px);font-weight:700;color:#FEF1D5;line-height:1.2}
.hbg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.brow{display:flex;justify-content:space-between;margin-bottom:4px}
.blbl{font-size:clamp(9px,1.3vw,10px);font-weight:600;text-transform:uppercase;letter-spacing:1px;color:rgba(254,241,213,.55)}
.btr{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.bfl{height:100%;border-radius:3px;transition:width .6s ease}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:#0C324A;display:grid;grid-template-columns:repeat(4,1fr);z-index:100;height:var(--nh);border-top:1px solid rgba(103,156,188,.15)}
.nb{background:transparent;border:none;font-family:'DM Sans',sans-serif;font-weight:600;font-size:clamp(9px,1.4vw,11px);letter-spacing:.3px;text-transform:uppercase;color:rgba(254,241,213,.4);padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;transition:color .15s}
.nb svg{width:21px;height:21px;opacity:.4;transition:opacity .15s}
.nb.on{color:#FEF1D5}
.nb.on svg{opacity:1}
.nb.on::after{content:'';position:absolute;top:0;left:15%;right:15%;height:2px;background:#679CBC}
.tp{padding:16px;animation:fi .18s ease}
.cd{background:#E0E0E0;border-radius:4px;padding:16px;margin-bottom:14px}
.ck{background:#0C324A;border-radius:4px;padding:16px;margin-bottom:14px}
.seclbl{font-size:clamp(10px,1.5vw,11px);font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#A38560;display:block;margin-bottom:12px}
.lc1{color:#0C324A} .lg1{background:rgba(12,50,74,.1)}   .lk1{background:#0C324A}
.lc2{color:#679CBC} .lg2{background:rgba(103,156,188,.12)} .lk2{background:#679CBC}
.lc3{color:#16302B} .lg3{background:rgba(22,48,43,.1)}   .lk3{background:#16302B}
.lc4{color:#C11720} .lg4{background:rgba(193,23,32,.1)}  .lk4{background:#C11720}
.tag{font-size:clamp(9px,1.4vw,11px);font-weight:700;padding:2px 8px;border-radius:2px;letter-spacing:.3px}
.tge{background:rgba(163,133,96,.15);color:#A38560}
.tgd{background:rgba(103,156,188,.15);color:#679CBC}
.tgc{background:rgba(12,50,74,.12);color:#0C324A}
.tgb{background:rgba(57,5,23,.12);color:#390517}
.tga{background:rgba(193,23,32,.12);color:#C11720}
.tgs{background:rgba(193,23,32,.18);color:#C11720;outline:1px solid #C11720}
.tgst{font-size:clamp(9px,1.4vw,11px);color:#A38560;font-weight:500}
.tkc{background:#FEF1D5;border-radius:3px;padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px;border-left:3px solid transparent;transition:opacity .15s}
.tkc.dn{opacity:.42}
.tkc.dn .tkn{text-decoration:line-through;color:#A38560}
.tkb{flex:1;min-width:0}
.tkn{font-size:clamp(13px,2vw,15px);font-weight:600;margin-bottom:3px;overflow-wrap:break-word;word-break:break-word}
.tkt{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.crdot{width:6px;height:6px;border-radius:50%;background:#C11720;flex-shrink:0}
.ebtn{font-family:'DM Sans',sans-serif;font-size:clamp(10px,1.5vw,12px);font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:7px 13px;background:transparent;color:#0C324A;border:1.5px solid #0C324A;cursor:pointer;border-radius:2px;flex-shrink:0;white-space:nowrap;transition:all .15s;-webkit-appearance:none}
.ebtn:active:not(:disabled){background:#0C324A;color:#FEF1D5}
.ebtn:disabled{opacity:.28;cursor:default}
.lwhd{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:8px;border-radius:3px}
.lwnum{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;color:#FEF1D5}
.lwt{flex:1}
.lwnm{font-size:clamp(12px,1.9vw,14px);font-weight:700}
.lwds{font-size:clamp(10px,1.5vw,12px);opacity:.75;margin-top:1px}
.sgcard{background:#0C324A;border-radius:4px;padding:16px;margin-bottom:14px}
.sgn{font-size:clamp(18px,3vw,23px);font-weight:800;color:#FEF1D5;letter-spacing:-.4px;margin-bottom:3px}
.sgo{font-size:clamp(12px,1.9vw,14px);color:rgba(254,241,213,.6);margin-bottom:14px;line-height:1.5}
.sgd{font-size:clamp(28px,5vw,38px);font-weight:800;color:#679CBC;line-height:1}
.sgdl{font-size:clamp(9px,1.4vw,11px);font-weight:600;color:rgba(254,241,213,.45);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.mscard{background:#FEF1D5;border-radius:3px;padding:13px;margin-bottom:8px}
.msn{font-size:clamp(13px,2vw,15px);font-weight:700;color:#0C324A;margin-bottom:3px}
.msd{font-size:clamp(11px,1.7vw,13px);color:#A38560;margin-bottom:8px;line-height:1.4}
.statrow{margin-bottom:12px}
.stattop{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-weight:600;font-size:clamp(12px,1.9vw,14px)}
.statr{height:5px;background:rgba(12,50,74,.1);border-radius:3px;overflow:hidden}
.statf{height:100%;border-radius:3px;transition:width .6s ease}
.hbars{display:flex;align-items:flex-end;gap:6px;height:90px}
.hbw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.hbar{width:100%;border-radius:2px 2px 0 0}
.hday{font-size:clamp(8px,1.3vw,10px);font-weight:600;color:#A38560}
.logrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(12,50,74,.08)}
.logrow:last-child{border-bottom:none}
.logdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.logdt{font-size:clamp(12px,1.9vw,14px);font-weight:600;margin-left:10px}
.logsb{font-size:clamp(10px,1.5vw,12px);color:#A38560;margin-left:10px}
.logri{text-align:right}
.logxp{font-size:clamp(13px,2vw,15px);font-weight:700;color:#679CBC}
.logpc{font-size:clamp(10px,1.5vw,11px);font-weight:700}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.sumcell{background:#E0E0E0;border-radius:4px;padding:14px 10px;text-align:center}
.sumv{font-size:clamp(18px,3vw,24px);font-weight:800;line-height:1;color:#0C324A}
.suml{font-size:clamp(9px,1.3vw,10px);font-weight:700;color:#A38560;text-transform:uppercase;letter-spacing:1px;display:block;margin-top:4px}
.difgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.difbox{background:#FEF1D5;border-radius:3px;padding:10px;text-align:center}
.flbl{font-size:clamp(10px,1.5vw,12px);font-weight:700;color:#0C324A;text-transform:uppercase;letter-spacing:1.5px;display:block;margin-bottom:6px}
.finp{background:#FEF1D5;border:1.5px solid rgba(12,50,74,.2);color:#03110D;font-family:'DM Sans',sans-serif;font-size:clamp(13px,2vw,15px);padding:10px 14px;width:100%;outline:none;border-radius:3px;transition:border-color .15s;-webkit-appearance:none}
.finp:focus{border-color:#679CBC}
textarea.finp{resize:none;line-height:1.5}
.pbtn{background:#0C324A;color:#FEF1D5;border:none;font-family:'DM Sans',sans-serif;font-weight:700;font-size:clamp(12px,1.9vw,14px);letter-spacing:.3px;text-transform:uppercase;padding:11px 22px;cursor:pointer;border-radius:3px;display:inline-flex;align-items:center;gap:7px;transition:all .15s;-webkit-appearance:none}
.pbtn:active:not(:disabled){background:#16302B}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.sbtn{background:transparent;border:1.5px solid rgba(12,50,74,.25);color:#0C324A;font-family:'DM Sans',sans-serif;font-weight:600;font-size:clamp(10px,1.5vw,12px);letter-spacing:.3px;padding:7px 14px;cursor:pointer;border-radius:3px;-webkit-appearance:none;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.sbtn:active{background:#E0E0E0}
.dbtn{background:transparent;color:#C11720;border:1.5px solid #C11720;font-family:'DM Sans',sans-serif;font-weight:600;font-size:clamp(10px,1.5vw,12px);padding:9px 16px;cursor:pointer;border-radius:3px;-webkit-appearance:none;display:inline-flex;align-items:center;gap:6px}
.frow{display:flex;gap:8px;align-items:flex-start}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.icell{background:#FEF1D5;border-radius:3px;padding:11px 13px}
.icll{font-size:clamp(9px,1.4vw,11px);font-weight:700;color:#A38560;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px}
.iclv{font-size:clamp(13px,2vw,15px);font-weight:600;color:#0C324A}
.propbox{border:2px solid #679CBC;background:rgba(103,156,188,.06);border-radius:4px;padding:16px;margin-top:14px;animation:pi .28s ease}
.propt{font-size:clamp(17px,2.8vw,21px);font-weight:800;color:#0C324A;margin-bottom:3px;letter-spacing:-.3px}
.props{font-size:clamp(12px,1.9vw,14px);color:#A38560;margin-bottom:14px}
.proptk{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:clamp(12px,1.9vw,14px)}
.tglbtn{width:44px;height:24px;border-radius:12px;position:relative;cursor:pointer;border:none;padding:0;transition:background .2s;flex-shrink:0}
.tgldot{width:18px;height:18px;background:#FEF1D5;border-radius:9px;position:absolute;top:3px;transition:left .2s;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pmbox{background:#FEF1D5;border:1.5px solid rgba(12,50,74,.15);border-radius:3px;padding:13px;font-family:'DM Sans',sans-serif;font-size:clamp(10px,1.5vw,12px);color:#16302B;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow-y:auto;margin-bottom:10px}
.empt{text-align:center;padding:28px 16px;border:1.5px dashed rgba(12,50,74,.2);border-radius:4px}
.emtl{font-size:clamp(12px,1.9vw,14px);font-weight:700;color:#0C324A;display:block;margin-bottom:6px}
.emth{font-size:clamp(12px,1.9vw,14px);color:#679CBC;font-weight:500}
#toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);color:#FEF1D5;padding:9px 20px;z-index:999;pointer-events:none;white-space:nowrap;display:none;border-radius:3px;font-size:clamp(11px,1.7vw,13px);font-weight:600;letter-spacing:.3px;box-shadow:0 4px 16px rgba(12,50,74,.3)}
.errmsg{color:#C11720;font-size:clamp(11px,1.6vw,13px);font-weight:500;margin-top:8px;display:none;padding:8px 0}
.divider{height:1px;background:rgba(12,50,74,.1);margin:12px 0}
.obbanner{background:rgba(193,23,32,.07);border:1.5px solid rgba(193,23,32,.28);border-radius:3px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.obbanner span{font-size:clamp(11px,1.7vw,13px);font-weight:600;color:#C11720}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pi{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
@keyframes hlp{0%,100%{opacity:1}50%{opacity:.25}}
.hlp{animation:hlp 1s ease-in-out infinite}
@media(max-width:360px){.hr{gap:10px}.nb span{display:none}}
@media(min-width:600px){.tp{padding:20px}#hud{padding:16px 22px 13px}}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app">
  <div id="hud">
    <div class="ht">
      <div class="aw" onclick="document.getElementById('avf').click()">
        <img id="avi" src="" alt="av" class="awi"/>
        <div class="awo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FEF1D5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </div>
        <div class="awl" id="hlv">01</div>
      </div>
      <input type="file" id="avf" accept="image/*" onchange="upAv(this)">
      <div class="hi">
        <div class="hn" id="hnm">OPERADOR</div>
        <div class="hk" id="hrk">Nivel 1 &middot; Recluta</div>
      </div>
      <div class="hr">
        <div class="hsi"><span class="hsl">Racha</span><span class="hsv" id="hstr">0D</span></div>
        <div class="hsi"><span class="hsl">XP</span><span class="hsv" id="hxp">0</span></div>
      </div>
    </div>
    <div class="hbg">
      <div>
        <div class="brow"><span class="blbl">HP</span><span class="blbl" id="hpt">100/100</span></div>
        <div class="btr"><div class="bfl" id="hpbar" style="width:100%;background:#679CBC"></div></div>
      </div>
      <div>
        <div class="brow"><span class="blbl">XP Nivel</span><span class="blbl" id="xpt">0/1000</span></div>
        <div class="btr"><div class="bfl" id="xpbar" style="width:0%;background:#A38560"></div></div>
      </div>

  </div>
  <div id="tab-m" class="tp"></div>
  <div id="tab-s" class="tp" style="display:none"></div>
  <div id="tab-h" class="tp" style="display:none"></div>
  <div id="tab-p" class="tp" style="display:none"></div>
  <nav id="nav">
    <button class="nb on" onclick="go('m')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
      <span>Habitos</span>
    </button>
    <button class="nb" onclick="go('s')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
      <span>Stats</span>
    </button>
    <button class="nb" onclick="go('h')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Historial</span>
    </button>
    <button class="nb" onclick="go('p')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Perfil</span>
    </button>
  </nav>
</div>
<script>
'use strict';
var DXP={E:50,D:100,C:180,B:300,A:500,S:800};
var SK=['claridad','motivacion','consistencia','satisfaccion','identidad','sistemas'];
var SN=['CLARIDAD','MOTIVACION','CONSISTENCIA','SATISFACCION','IDENTIDAD','SISTEMAS'];
var DN=['Dom','Lun','Mar','Mie','Jue','Vie','Sab'];
var LAWS={
  1:{name:'Hacerlo Obvio',desc:'Crea una senal visible',col:'#0C324A'},
  2:{name:'Hacerlo Atractivo',desc:'Aumenta el deseo de hacerlo',col:'#679CBC'},
  3:{name:'Hacerlo Facil',desc:'Reduce la friccion al minimo',col:'#16302B'},
  4:{name:'Hacerlo Satisfactorio',desc:'Recompensa inmediata',col:'#C11720'}
};
var BLANK='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><rect width="48" height="48" rx="24" fill="#16302B"/><circle cx="24" cy="18" r="9" fill="#0C324A"/><path d="M5 46c0-10.5 8.5-19 19-19s19 8.5 19 19" fill="#0C324A"/></svg>');
var DEF={
  player:{name:'OPERADOR',xp:0,hp:100,maxHp:100,streak:0},
  stats:{claridad:0,motivacion:0,consistencia:0,satisfaccion:0,identidad:0,sistemas:0},
  saga:{name:'Sin habito activo',objective:'Ve a Perfil y crea tu primer habito con las 4 Leyes',startDate:new Date().toISOString(),totalDays:90},
  weeklyMissions:[],dailyTasks:[],history:[],lastDate:'',overloaded:false
};
var S,AV='';
function loadS(){
  try{var r=localStorage.getItem('opv5');if(r)S=JSON.parse(r);}catch(e){}
  if(!S)S=JSON.parse(JSON.stringify(DEF));
  if(!S.lastDate)S.lastDate='';
  if(S.overloaded===undefined)S.overloaded=false;
  if(S.stats.vitalidad!==undefined)S.stats={claridad:S.stats.vitalidad||0,motivacion:S.stats.fuerza||0,consistencia:S.stats.agilidad||0,satisfaccion:S.stats.resistencia||0,identidad:S.stats.inteligencia||0,sistemas:S.stats.sabiduria||0};
  try{AV=localStorage.getItem('op_av')||'';}catch(e){}
}
function saveS(){try{localStorage.setItem('opv5',JSON.stringify(S));}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function dailyReset(){
  if(!S.dailyTasks.length)return;
  var t=today();if(S.lastDate===t)return;
  var done=S.dailyTasks.filter(function(x){return x.done;}).length;
  var tot=S.dailyTasks.length;
  var cm=S.dailyTasks.filter(function(x){return x.critical&&!x.done;}).length;
  var xp=S.dailyTasks.reduce(function(a,x){return a+(x.done?(DXP[x.difficulty]||0):0);},0);
  if(S.lastDate)S.history.push({date:new Date().toISOString(),xpGained:xp,tasksCompleted:done,totalTasks:tot});
  if(S.history.length>90)S.history=S.history.slice(-90);
  S.player.streak=done>0?S.player.streak+1:0;
  if(cm>0)S.player.hp=Math.max(10,S.player.hp-cm*15);
  else if(done===tot&&tot>0)S.player.hp=Math.min(S.player.maxHp,S.player.hp+10);
  else if(done>0)S.player.hp=Math.min(S.player.maxHp,S.player.hp+3);
  if(S.player.hp<40)S.overloaded=true;
  var ez={S:'A',A:'B',B:'C',C:'D',D:'E',E:'E'};
  S.dailyTasks=S.dailyTasks.map(function(x){
    var r=Object.assign({},x,{done:false});
    if(S.overloaded&&!x.critical)r.difficulty=ez[x.difficulty]||x.difficulty;
    return r;
  });
  S.lastDate=t;saveS();
}
function lvl(xp){var l=1,th=1000,tot=0;while(xp>=tot+th){tot+=th;l++;th=Math.floor(th*1.4);}return{level:l,current:xp-tot,needed:th};}
function hpc(p){return p>60?'#679CBC':p>30?'#A38560':'#C11720';}
function tgcls(d){var m={E:'tge',D:'tgd',C:'tgc',B:'tgb',A:'tga',S:'tgs'};return'tag '+(m[d]||'tge');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rnk(l){var r=['Recluta','Iniciado','Operativo','Agente','Especialista','Veterano','Elite','Maestro','Leyenda'];return r[Math.min(l-1,r.length-1)];}
var _ti;

function mkTask(t){
  var lc=t.law&&LAWS[t.law]?LAWS[t.law].col:'transparent';
  var h='<div class="tkc'+(t.done?' dn':'')+'" style="border-left-color:'+lc+'">';

  h+='<div class="tkb"><div class="tkn">'+esc(t.name)+'</div>';
  h+='<div class="tkt"><span class="'+tgcls(t.difficulty)+'">'+esc(t.difficulty)+'</span>';

  h+='<button class="ebtn"'+(t.done?' disabled':'')+' onclick="doTask(\''+t.id+'\')">'+(t.done?'\u2713 Hecho':'Hacer')+'</button></div>';
  return h;
}
function doTask(id){
  var i=-1;for(var j=0;j<S.dailyTasks.length;j++){if(S.dailyTasks[j].id===id){i=j;break;}}
  if(i<0||S.dailyTasks[i].done)return;
  var t=S.dailyTasks[i],xpg=DXP[t.difficulty]||50,oL=lvl(S.player.xp).level;
  S.player.xp+=xpg;S.stats[t.stat]=(S.stats[t.stat]||0)+1;S.dailyTasks[i].done=true;
  var hg=t.critical?5:2;S.player.hp=Math.min(S.player.maxHp,S.player.hp+hg);
  if(S.player.hp>=40&&S.overloaded){S.overloaded=false;toast('HP recuperado - modo normal restaurado','#16302B',3000);}

  if(nL>oL)setTimeout(function(){toast('Nivel '+nL+' alcanzado!','#0C324A');},60);
  else toast('+'+xpg+' XP \u00b7 '+t.stat+' +1','#679CBC');
  if(!S.lastDate)S.lastDate=today();
  saveS();updHUD();renderM();
}

  '<button class="pbtn" onclick="document.getElementById(\'avf\').click()">'+
  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>'+
  ' Subir foto</button></div></div></div>'+
  '<div class="ck">'+
  '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'+
  '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#679CBC" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>'+
  '<span style="font-size:clamp(14px,2.2vw,17px);font-weight:800;color:#FEF1D5">Generador con las 4 Leyes</span></div>'+
  '<div style="font-size:clamp(12px,1.9vw,14px);color:rgba(254,241,213,.65);margin-bottom:14px;line-height:1.6">'+
  'Usa cualquier IA: ChatGPT, Gemini, Copilot, Claude&hellip;<br>'+
  '<span style="color:#679CBC;font-weight:700">1</span> Copia el prompt &rarr; pegalo en tu IA &rarr; escribe tu habito.<br>'+
  '<span style="color:#679CBC;font-weight:700">2</span> Copia el JSON que recibes &rarr; pegalo abajo.<br>'+
  '<span style="color:#679CBC;font-weight:700">3</span> Presiona Procesar.'+
  '<div style="margin-top:10px;padding:8px 10px;background:rgba(103,156,188,.1);border-radius:3px;font-size:clamp(10px,1.5vw,12px);color:#679CBC;font-weight:600">'+
  'El prompt aplica automaticamente las 4 Leyes. Tu solo describes el habito.</div></div>'+
  '<span class="flbl" style="color:rgba(254,241,213,.55)">Prompt para tu IA</span>'+
  '<div class="pmbox" id="ptm" style="background:rgba(3,17,13,.35);border-color:rgba(103,156,188,.2);color:rgba(254,241,213,.65)">'+esc(PROMPT)+'</div>'+
  '<div style="display:flex;justify-content:flex-end;margin-bottom:16px">'+
  '<button class="sbtn" style="border-color:rgba(103,156,188,.35);color:#679CBC" onclick="cpPr()">'+
  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'+
  ' Copiar prompt</button></div>'+
  '<span class="flbl" style="color:rgba(254,241,213,.55)">Pega el JSON aqui</span>'+
  '<textarea id="jin" class="finp" rows="6" style="background:rgba(3,17,13,.35);border-color:rgba(103,156,188,.2);color:#FEF1D5" placeholder=\'{"sagaName":"...","dailyTasks":[...]}\'></textarea>'+
  '<div style="display:flex;justify-content:flex-end;margin-top:10px">'+
  '<button class="pbtn" style="background:#679CBC;color:#0C324A" onclick="procJ()">'+
  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'+
  ' Procesar</button></div>'+
  '<div id="jerr" class="errmsg"></div><div id="jprop"></div></div>'+
  '<div class="cd" style="border:1.5px solid '+(ov?'rgba(193,23,32,.3)':'rgba(12,50,74,.1)')+'">'+
  '<span class="seclbl">Modo sobrecargado</span>'+
  '<div style="font-size:clamp(12px,1.9vw,14px);color:#A38560;margin-bottom:14px;line-height:1.6">'+
  'Reduce tareas a solo las criticas y faciles. Baja la dificultad de las opcionales.<br>'+
  '<span style="color:#C11720;font-size:clamp(10px,1.5vw,12px);font-weight:600">Se activa automaticamente si tu HP cae bajo 40.</span></div>'+
  '<div style="display:flex;align-items:center;gap:14px;cursor:pointer" onclick="togOv()">'+
  '<button class="tglbtn" style="background:'+(ov?'#C11720':'#E0E0E0')+'"><div class="tgldot" style="left:'+(ov?'23':'3')+'px"></div></button>'+
  '<div><div style="font-size:clamp(13px,2vw,15px);font-weight:700;color:'+(ov?'#C11720':'#A38560')+'">'+(ov?'Activo':'Inactivo')+'</div>'+
  '<div style="font-size:clamp(11px,1.7vw,13px);color:#A38560;margin-top:1px">'+(ov?'Toca para desactivar':'Toca para activar')+'</div></div></div></div>'+
  '<div class="cd"><span class="seclbl">Datos</span>'+
  '<div style="font-size:clamp(12px,1.9vw,14px);color:#A38560;margin-bottom:12px">Borra todo el progreso y reinicia la app.</div>'+
  '<button class="dbtn" onclick="resAll()">'+
  '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>'+
  ' Resetear progreso</button></div>';
}
function togNE(){var d=document.getElementById('ne');d.style.display=d.style.display==='none'?'block':'none';}
function savNm(){var v=(document.getElementById('ni').value||'').trim();if(!v)return;S.player.name=v;saveS();updHUD();renderP();toast('Nombre actualizado','#16302B');}
function cpPr(){
  var t=document.getElementById('ptm');
  if(navigator.clipboard)navigator.clipboard.writeText(t.textContent).then(function(){toast('Prompt copiado','#0C324A');});
  else{var r=document.createRange();r.selectNode(t);window.getSelection().removeAllRanges();window.getSelection().addRange(r);document.execCommand('copy');window.getSelection().removeAllRanges();toast('Prompt copiado','#0C324A');}
}
function togOv(){S.overloaded=!S.overloaded;saveS();renderP();toast(S.overloaded?'Modo sobrecargado activado':'Modo normal restaurado',S.overloaded?'#C11720':'#16302B');}
function resAll(){
  if(!confirm('Resetear todo el progreso?'))return;
  ['opv5','op_v4','op_v3','op_v2','op_av','op_avatar'].forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});
  S=JSON.parse(JSON.stringify(DEF));AV='';saveS();updHUD();renderP();toast('Datos reseteados','#A38560');
}
function procJ(){
  var inp=document.getElementById('jin'),err=document.getElementById('jerr'),prop=document.getElementById('jprop');
  err.style.display='none';prop.innerHTML='';
  var raw=(inp&&inp.value||'').trim();
  if(!raw){err.textContent='Pega el JSON generado por tu IA primero.';err.style.display='block';return;}
  var json=null,m=raw.match(/\{[\s\S]*\}/);
  if(m){try{json=JSON.parse(m[0]);}catch(e){}}
  if(!json){try{json=JSON.parse(raw);}catch(e){}}
  if(!json){err.textContent='JSON invalido. Copia la respuesta completa de tu IA.';err.style.display='block';return;}
  if(!json.sagaName&&!json.dailyTasks){err.textContent='Formato inesperado. Usa el prompt incluido.';err.style.display='block';return;}
  showProp(json,prop);
}
function showProp(p,el){
  var th='';
  (p.dailyTasks||[]).forEach(function(t){
    var ln=t.law,lc=ln&&LAWS[ln]?LAWS[ln]:{col:'#A38560'};
    th+='<div class="proptk">';
    if(ln)th+='<span style="background:'+lc.col+';color:#FEF1D5;font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;flex-shrink:0">L'+ln+'</span>';
    th+='<span class="'+tgcls(t.difficulty||'D')+'" style="flex-shrink:0">'+esc(t.difficulty||'D')+'</span>';
    th+='<span style="flex:1">'+esc(t.name)+'</span>';
    if(t.critical)th+='<span style="font-size:10px;font-weight:700;color:#C11720;flex-shrink:0">\u2605 critica</span>';
    th+='</div>';
  });
  var mh='';
  (p.weeklyMissions||[]).forEach(function(m){
    mh+='<div style="background:#E0E0E0;padding:9px 12px;margin-bottom:6px;border-radius:3px;font-size:clamp(12px,1.9vw,14px)"><strong>'+esc(m.name)+'</strong> <span style="color:#A38560;margin-left:8px">'+esc(m.description)+'</span></div>';
  });
  el.innerHTML='<div class="divider"></div><div class="propbox">'+
    '<div style="font-size:clamp(9px,1.4vw,11px);font-weight:700;color:#679CBC;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px">Habito propuesto &mdash; revisa y confirma</div>'+
    '<div class="propt">'+esc(p.sagaName||'Nuevo habito')+'</div>'+
    '<div class="props">'+esc(p.objective||'')+'</div>'+
    '<div style="font-size:10px;font-weight:700;color:#A38560;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Misiones semanales</div>'+
    '<div style="margin-bottom:12px">'+mh+'</div>'+
    '<div style="font-size:10px;font-weight:700;color:#A38560;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Tareas diarias</div>'+
    '<div style="margin-bottom:16px">'+th+'</div>'+
    '<div class="frow">'+
    '<button class="pbtn" onclick=\'accM('+JSON.stringify(JSON.stringify(p))+')\'>\u2713 Activar habito</button>'+
    '<button class="dbtn" onclick="document.getElementById(\'jprop\').innerHTML=\'\'">Descartar</button>'+
    '</div></div>';
}
function accM(js){
  var p;try{p=JSON.parse(js);}catch(e){toast('Error al procesar','#C11720');return;}
  var nt=(p.dailyTasks||[]).map(function(t,i){return{id:'t'+Date.now()+'_'+i,name:t.name,difficulty:t.difficulty||'D',stat:t.stat||'claridad',done:false,critical:!!t.critical,law:t.law||null};});
  var nm=(p.weeklyMissions||[]).map(function(m,i){return{id:'m'+Date.now()+'_'+i,name:m.name,description:m.description,progress:0,total:m.total||5,stat:m.stat||'claridad',law:m.law||null};});
  S.saga={name:p.sagaName||'Nuevo habito',objective:p.objective||'',startDate:new Date().toISOString(),totalDays:90};
  S.weeklyMissions=S.weeklyMissions.concat(nm);S.dailyTasks=nt;S.lastDate=today();
  saveS();toast('Habito activado con las 4 Leyes!','#0C324A',3000);go('m');
}
loadS();dailyReset();updHUD();renderM();
</script>
